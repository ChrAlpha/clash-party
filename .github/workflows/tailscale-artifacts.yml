name: Tailscale Test Artifacts

on:
  push:
    branches:
      - ci/tailscale-artifacts

permissions:
  contents: read

concurrency:
  group: tailscale-test-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        env:
          npm_config_arch: x64
          npm_config_target_arch: x64
        run: pnpm install
      - name: Set test version
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
        run: node scripts/update-version.mjs
      - name: Prepare
        run: pnpm prepare --x64
      - name: Build
        env:
          npm_config_arch: x64
          npm_config_target_arch: x64
        run: pnpm build:win --x64
      - name: Add portable flag
        shell: pwsh
        run: |
          New-Item -Path 'PORTABLE' -ItemType File
          Get-ChildItem dist/*portable.7z | ForEach-Object {
            7z a $_.FullName PORTABLE
          }
      - name: Generate checksums
        run: pnpm checksum setup.exe portable.7z
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: tailscale-windows-x64
          path: |
            dist/*.sha256
            dist/*setup.exe
            dist/*portable.7z
          if-no-files-found: error
          retention-days: 7

  linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        env:
          npm_config_arch: x64
          npm_config_target_arch: x64
        run: |
          pnpm install
          sed -i 's/productName: Clash Party/productName: clash-party/' electron-builder.yml
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - name: Set test version
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
        run: node scripts/update-version.mjs
      - name: Prepare
        run: pnpm prepare --x64
      - name: Build
        env:
          npm_config_arch: x64
          npm_config_target_arch: x64
        run: pnpm build:linux --x64
      - name: Generate checksums
        run: pnpm checksum .deb .rpm .pkg.tar.zst
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: tailscale-linux-x64
          path: |
            dist/*.sha256
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  macos-arm64:
    name: macOS arm64 unsigned
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        env:
          npm_config_arch: arm64
          npm_config_target_arch: arm64
        run: pnpm install
      - name: Set test version
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
        run: node scripts/update-version.mjs
      - name: Prepare
        run: pnpm prepare --arm64
      - name: Build unsigned package
        env:
          npm_config_arch: arm64
          npm_config_target_arch: arm64
        run: |
          chmod +x build/pkg-scripts/postinstall build/pkg-scripts/preinstall
          pnpm build:mac --arm64
      - name: Generate checksums
        run: pnpm checksum .pkg
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: tailscale-macos-arm64-unsigned
          path: |
            dist/*.sha256
            dist/*.pkg
          if-no-files-found: error
          retention-days: 7
